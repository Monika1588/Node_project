<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HealthCarePlus | Update Profile</title>


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">


<link rel="stylesheet" href="update-patient-profile.css">


</head>


<body>


<div class="page">


<!-- HEADER -->

<header class="header">


<div class="logo">
🏥 HealthCarePlus
</div>


<a href="/patient-profile-dashboard.html">
← Back To Profile
</a>


</header>








<main class="profile-wrapper">





<section class="profile-card">





<div class="title-section">


<h1>
Update Profile
</h1>


<p>
Manage your personal information securely.
</p>


</div>









<!-- PROFILE IMAGE -->


<div class="photo-section">


<div class="image-container">


<img 
id="profilePhoto"
src="https://cdn-icons-png.flaticon.com/512/147/147144.png"
alt="Profile">


</div>



<input 
type="file"
id="photoInput"
accept="image/*">





<div class="photo-actions">


<button id="uploadPhotoBtn">

Upload Photo

</button>



<button id="removePhotoBtn">

Remove

</button>


</div>


</div>









<form id="profileForm">





    <div class="form-grid">

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" name="name" required>
        </div>
    
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" name="email" required>
        </div>
    
        <div class="input-group">
            <label>Phone Number</label>
            <input type="text" name="phone">
        </div>
    
        <div class="input-group">
            <label>Age</label>
            <input type="number" name="age">
        </div>
    
        <div class="input-group">
            <label>Gender</label>
            <select name="gender">
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </div>
    
        <!-- New Specialization Field -->
        <div class="input-group">
            <label>Specialization</label>
            <input
                type="text"
                name="specialization"
                placeholder="e.g. Cardiologist">
        </div>
    
    </div>









<div class="password-section">


<h3>
🔐 Change Password
</h3>



<div class="form-grid">


<div class="input-group">

<label>
Old Password
</label>

<input 
type="password"
name="oldPassword">

</div>






<div class="input-group">

<label>
New Password
</label>

<input 
type="password"
name="newPassword">

</div>






<div class="input-group">

<label>
Confirm Password
</label>


<input 
type="password"
name="confirmPassword">


</div>



</div>


</div>








<button 
id="submitBtn"
type="submit"
class="update-btn">


Save Changes


</button>





</form>





<div id="msg"></div>





</section>



</main>



</div>








<!-- SUCCESS POPUP -->


<div id="successPopup">

<div class="popup-content">

<h3>
Profile Updated Successfully!
</h3>

</div>

</div>





<script src="update-patient-profile.js"></script>


</body>

</html>
