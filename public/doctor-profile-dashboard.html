<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>HealthCarePlus | Patient Profile</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">


<!-- Font Awesome -->
<link 
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">


<link rel="stylesheet" href="doctor-profile-dashboard.css">


</head>


<body>


<div class="background-shape"></div>





<!-- Main Container -->

<main class="profile-container">





<!-- Profile Header -->


<section class="profile-card">



<div class="profile-header">


<div class="avatar-wrapper">


<img 
id="photo"
class="profile-photo"
src="https://cdn-icons-png.flaticon.com/512/147/147144.png"
alt="Patient Photo">


<div class="online-dot"></div>


</div>





<div class="profile-title">


<h1 id="name">
Loading...
</h1>


<p>
<i class="fa-solid fa-user-shield"></i>

Doctor Account

</p>


</div>



</div>

<!-- Information Section -->


<div class="information-section">



<div class="info-card">


<i class="fa-solid fa-envelope"></i>


<div>

<span>Email</span>

<p id="email">
Loading...
</p>


</div>


</div>








<div class="info-card">


<i class="fa-solid fa-phone"></i>


<div>

<span>Phone</span>

<p id="phone">
Loading...
</p>


</div>


</div>








<div class="info-card">


<i class="fa-solid fa-calendar"></i>


<div>

<span>Age</span>

<p id="age">
Loading...
</p>


</div>


</div>








<div class="info-card">


<i class="fa-solid fa-venus-mars"></i>


<div>

<span>Gender</span>

<p id="gender">
Loading...
</p>


</div>


</div>








<div 
class="info-card"
id="specializationBox"
style="display:none;">



<i class="fa-solid fa-stethoscope"></i>


<div>

<span>
Specialization
</span>


<p id="specialization">

</p>


</div>


</div>




</div>









<!-- Actions -->


<div class="profile-actions">


<button 
onclick="window.location.href='update-patient-profile.html'"
class="update-btn">


<i class="fa-solid fa-pen"></i>

Update Profile


</button>






<a 
href="/doctor-dashboard.html"
class="back-btn">


<i class="fa-solid fa-arrow-left"></i>

Back Dashboard


</a>



</div>






</section>






</main>









<script>


async function loadProfile(){


try{


const res =
await fetch('/api/profile/me',
{
credentials:'include'
});



const js =
await res.json();



if(!js.user)
return;



const u=js.user;



document.getElementById("name")
.innerText=u.name || "Patient";



document.getElementById("email")
.innerText=u.email || "N/A";



document.getElementById("phone")
.innerText=u.phone || "N/A";



document.getElementById("age")
.innerText=u.age || "N/A";



document.getElementById("gender")
.innerText=u.gender || "N/A";





if(u.specialization){


document.getElementById("specializationBox")
.style.display="flex";



document.getElementById("specialization")
.innerText=u.specialization;


}





if(u.photo){

document.getElementById("photo")
.src=u.photo;

}



}

catch(error){

console.error(
"Profile loading error:",
error
);

}


}




loadProfile();



</script>



</body>

</html>
